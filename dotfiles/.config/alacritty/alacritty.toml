[general]
live_config_reload = true

[font]
size = 11.0

[font.normal]
family = "JetBrainsMono Nerd Font Mono"
style = "SemiBold"

[font.bold]
family = "JetBrainsMono Nerd Font Mono"
style = "Bold"

[font.italic]
#family = "JetBrainsMono Nerd Font Mono"
family = "VictorMono Nerd Font Mono"
style = "Italic"

[font.bold_italic]
#family = "JetBrainsMono Nerd Font Mono"
family = "VictorMono Nerd Font Mono"
style = "Bold Italic"


[window]
decorations = "None"
opacity = 0.5

padding = { x = 35, y = 10 }
dynamic_padding = true


[cursor]
style = "Beam"
blink_timeout = 0
unfocused_hollow = true


[scrolling]
history = 1000


[colors.primary]
foreground = "#cdd6f4"
background = "#232423"

[colors.normal]
black = "#000000"
red = "#ef596f"
green = "#89ca78"
yellow = "#e5c07b"
blue = "#61afef"
magenta = "#d55fde"
cyan = "#2bbac5"
white = "#abb2bf"

[colors.bright]
black = "#1a1a1a"
red = "#f38897"
green = "#a9d89d"
yellow = "#edd4a6"
blue = "#8fc6f4"
magenta = "#e089e7"
cyan = "#4bced8"
white = "#c8cdd5"

[colors.cursor]
text = "CellBackground"
cursor = "CellForeground" # syntax-cursor-color

[colors.selection]
text = "CellForeground"
background = "#434852"

[colors]
draw_bold_text_with_bright_colors = true
